name: Update README Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (includes private with STATS_PAT)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=devsabirali&show_icons=true&theme=dark&hide_border=true&bg_color=0D1117&title_color=38BDF8&icon_color=A78BFA&text_color=FFFFFF&count_private=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top languages card (includes private with STATS_PAT)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=devsabirali&layout=compact&theme=dark&hide_border=true&bg_color=0D1117&title_color=38BDF8&text_color=FFFFFF&langs_count=8&count_private=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Commit stats cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
