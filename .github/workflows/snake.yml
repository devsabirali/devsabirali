name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: devsabirali
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark

      - name: Save snake to assets folder
        run: |
          mkdir -p assets
          ls -la dist/
          cp dist/github-contribution-grid-snake.svg assets/contribution-snake.svg
          ls -la assets/

      - name: Commit snake to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update contribution snake"
          file_pattern: assets/contribution-snake.svg
          branch: main
