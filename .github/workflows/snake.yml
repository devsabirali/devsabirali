name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: devsabirali
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark

      - name: Copy snake to assets folder
        run: |
          mkdir -p assets
          cp dist/github-contribution-grid-snake.svg assets/contribution-snake.svg

      - name: Commit snake to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          git commit -m "Update contribution snake" || exit 0
          git push
